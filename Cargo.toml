[workspace]
resolver = "2"
members = ["crates/dictate-core", "crates/dictate-cli"]

[workspace.package]
version = "1.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tindotdev/dictate"

[workspace.dependencies]
# Shared error handling
thiserror = "2.0.18"

# Audio processing
audioadapter = "2.0.0"
audioadapter-buffers = "2.0.0"
cpal = "0.17.1"
ringbuf = "0.4.8"
rubato = "1.0.1"

# Text processing
unicode-normalization = "0.1.25"

# HTTP + serialization (transcription providers)
bytes = "1.11.1"
httpmock = "0.8.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "multipart", "rustls", "gzip", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio-util = "0.7.18"

# Configuration
directories = "6.0.0"

# CLI dependencies
clap = { version = "4.5.57", features = ["derive"] }
clap_complete = "4.5.66"
ctrlc = { version = "3.5.1", features = ["termination"] }
dialoguer = "0.12.0"
owo-colors = "4.2.3"
tabled = "0.20.0"
signal-hook = "0.4.3"

# Testing
tempfile = "3.25.0"

# Prompt evaluation
strsim = "0.11.1"

# Internal workspace crates
dictate-core = { path = "crates/dictate-core", version = "1.5.0" }

# The profile that 'cargo dist' will build with.
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.clippy]
# Lint groups (priority -1 so individual overrides take effect).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Useful restriction lints (cherry-picked — the group is NOT meant to be enabled wholesale).
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
rest_pat_in_fully_bound_structs = "deny"
undocumented_unsafe_blocks = "deny"

# Transitive dependency version conflicts we can't control.
multiple_crate_versions = "allow"
# Internal workspace crates — not published to crates.io.
cargo_common_metadata = "allow"
