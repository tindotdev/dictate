[workspace]
# Generate changelog using Keep a Changelog format (matches existing CHANGELOG.md).
changelog_config = "cliff.toml"

# PR settings
pr_name = "chore: release v{{ version }}"

# Tag format — matches existing tags (v1.0.0, v1.1.0, etc.).
# Default for multi-package workspaces is "{{ package }}-v{{ version }}".
git_tag_name = "v{{ version }}"

# Not published to crates.io — use git tags for version detection.
publish = false
git_release_enable = true
git_tag_enable = true

# dictate-core is an internal library — no separate release.
[[package]]
name = "dictate-core"
git_only = true
release = false

# Only release the CLI package (the user-facing binary).
[[package]]
name = "dictate-cli"
git_only = true
