pre-commit:
  parallel: true
  commands:
    biome:
      root: daemon/
      glob: "*.{ts,js,json}"
      run: bunx biome check --write --unsafe {staged_files}
      stage_fixed: true

    stylua:
      root: nvim/
      glob: "*.lua"
      run: stylua {staged_files}
      stage_fixed: true

    selene:
      root: nvim/
      glob: "lua/**/*.lua"
      run: selene {staged_files}
